# Model Gateway Configuration Template
# Copy this file, name it anything, and pass it to the --model-config flag.
# Run:
#  ./bobctl install --model-config <filename>.yaml
#  OR
#  ./bobctl update-model-config --model-config <filename>.yaml
#
# ── How to configure your model ──────────────────────────────────────────────
#
# 1. Fill in model and credentials for your chosen provider in the x-providers
#    section.
# 2. In the "ACTIVE MODEL" section, change <<: *isvc to your chosen provider
#    anchor (*azure, *bedrock, or *gemini).
# 3. In the router section, confirm default_model matches the model_name as well.
#
# ── model_info fields ────────────────────────────────────────────────────────
#   exposed                   — true: visible in /models list; false: internal-only
#   max_input_tokens          — context window size
#   max_output_tokens         — maximum tokens the model may generate
#   mode                      — chat | embedding | image_generation
#   supports_prompt_caching   — true if the model supports prompt caching
#   supports_vision           — true if the model supports image inputs
#   provider                  — model provider (e.g. openai, anthropic, google, nvidia, mistral)
#   family                    — model family within the provider (e.g. gpt, sonnet, gemini)
#   version                   — model version string (e.g. "5", "3.6-flash")
#                               See README.md for the full list of supported values.

# ── Provider definitions ──────────────────────────────────────────────────────
# The x-providers key is ignored by the model gateway — it is a YAML
# scratchpad documenting examples from the supported providers.
# Only the active provider needs credentials and have its anchor referenced
# below under ACTIVE MODEL
x-providers:

  # OpenAI-compatible endpoint (e.g. Azure OpenAI)
  azure: &azure
    openai_compatible:
      model: gpt-5.6-sol                          # Model ID as expected by the provider
      base_url: https://ai-sg.services.ai.azure.com/openai # TODO 
      api_key: env.AZURE_API_KEY              # env.<VAR> reads from the model gateway secrets
    model_info:
      exposed: true
      provider: openai
      family: gpt
      version: "5.6-sol"
      max_input_tokens: 270000
      max_output_tokens: 20000
      supports_prompt_caching: true
      supports_vision: true
      mode: chat

  # AWS Bedrock
  bedrock: &bedrock
    bedrock:
      model: global.amazon.nova-2-lite-v1:0     # TODO
      region: ap-southeast-1                    # AWS region where your Bedrock endpoint lives
      access_key_id: env.AWS_ACCESS_KEY         # env.<VAR> reads from the model gateway secrets
      secret_access_key: env.AWS_SECRET_ACCESS_KEY
    model_info:
      exposed: true
      provider: anthropic                       # No need to align to model
      family: sonnet                            # No need to align to model
      version: "5"                              # No need to align to model
      max_input_tokens: 270000
      max_output_tokens: 20000
      supports_prompt_caching: true
      supports_vision: true
      mode: chat

  # Google Vertex AI (Gemini)
  gemini: &gemini
    vertex:
      model: gemini-3.6-flash
      project: gcp-data-davidkhala                # TODO GCP project ID
      location: global                            # Vertex AI region / "global" for Global API
      credentials: env.GEMINI_CREDENTIALS     # Service-account JSON, base64-encoded. Required Role: Agent Platform User `roles/aiplatform.user`
    model_info:
      exposed: true
      provider: google
      family: gemini
      version: "3.6-flash"
      max_input_tokens: 270000
      max_output_tokens: 20000
      supports_prompt_caching: true
      supports_vision: true
      mode: chat

  # Custom Inference Service (RHOAI, vLLM, etc)
  inference_service: &isvc
    openai_compatible:
      model: nvidia/nemotron-3-ultra-550b
      base_url: <https://llm-inference-server>  # `/v1/chat/completions` will be appended
      api_key: env.INFERENCE_API_KEY
      extra_headers:
        custom-key-header: env.INFERENCE_API_KEY
    model_info:
      exposed: true
      provider: nvidia
      family: nemotron
      version: "3-ultra"
      max_input_tokens: 262144
      supports_vision: false
      mode: chat

# ── Models ────────────────────────────────────────────────────────────────────
models:

  # ── ACTIVE MODEL ─────────────────────────────────────────────────────────────
  # Change <<: *isvc to eg. *azure, *bedrock, or *gemini to
  # switch providers / models to one fully configured above
  - &chat_llm
    <<: *azure                     # ← TODO change provider here
    model_name: premium-ide

  # ── Aliases ───────────────────────────────────────────────────────────────────
  - <<: *bedrock                    # ← TODO change provider here
    model_name: security            

  - <<: *gemini                     # ← TODO change provider here
    model_name: background


# ── Router ────────────────────────────────────────────────────────────────────
routers:
  - name: router
    strategy: static
    static:
      default_model: premium-ide
